
# PostgreSQL: configuración del microservicio de películas.
# La base de datos de desarrollo ya existe en Docker.
# No ejecutar migraciones hasta verificar el esquema existente.

default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("DB_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DB_PORT_PELICULAS", 5434) %>
  username: <%= ENV.fetch("POSTGRES_USER") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD") %>

development:
  <<: *default
  database: <%= ENV.fetch("PELICULAS_DB") %>

# Base independiente para pruebas.
# No se crea automáticamente con esta configuración.
test:
  <<: *default
  database: cine_peliculas_test

# Configuración de producción.
# Utiliza variables de entorno independientes.
production:
  primary: &primary_production
    adapter: postgresql
    encoding: unicode
    pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
    host: <%= ENV.fetch("DB_HOST", "127.0.0.1") %>
    port: <%= ENV.fetch("DB_PORT_PELICULAS", 5434) %>
    database: <%= ENV.fetch("PELICULAS_DB") %>
    username: <%= ENV.fetch("POSTGRES_USER") %>
    password: <%= ENV.fetch("POSTGRES_PASSWORD") %>
  cache:
    <<: *primary_production
    database: cine_peliculas_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: cine_peliculas_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: cine_peliculas_production_cable
    migrations_paths: db/cable_migrate
