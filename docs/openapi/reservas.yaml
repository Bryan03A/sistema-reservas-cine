
openapi: 3.0.3

info:
  title: Microservicio de Reservas
  version: 1.0.0
  description: Gestion de reservas, confirmaciones, cancelaciones y reportes

servers:
  - url: http://localhost:3003/api/v1

paths:
  /reservas:
    get:
      summary: Consultar reservas
      responses:
        "200":
          description: Lista de reservas
    post:
      summary: Crear una reserva
      responses:
        "201":
          description: Reserva creada
        "400":
          description: Datos invalidos

  /reservas/mis-reservas:
    get:
      summary: Consultar las reservas del usuario autenticado
      responses:
        "200":
          description: Lista de reservas del usuario
        "401":
          description: Usuario no autenticado

  /reservas/{id}/confirmar:
    post:
      summary: Confirmar una reserva
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Identificador de la reserva
      responses:
        "200":
          description: Reserva confirmada
        "404":
          description: Reserva no encontrada

  /reservas/{id}/cancelar:
    post:
      summary: Cancelar una reserva
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Identificador de la reserva
      responses:
        "200":
          description: Reserva cancelada
        "404":
          description: Reserva no encontrada

  /reportes/general:
    get:
      summary: Consultar el reporte general de reservas
      responses:
        "200":
          description: Reporte general generado
