# Sirve el frontend por HTTP (80) y HTTPS (443) y reenvía las APIs en el mismo origen:
#   /api/usuarios/*   -> usuarios:3001   (/api/v1/*)
#   /api/peliculas/*  -> peliculas:3002  (/api/v1/*)
#   /api/reservas/*   -> reservas:3003   (/api/v1/*)
# /health y /.well-known/jwks.json de cada servicio se reenvían a su ruta raíz.
# Al estar todo en el mismo origen no hay CORS ni contenido mixto, y la cámara (que exige HTTPS) funciona en el celular.

resolver 127.0.0.11 valid=10s ipv6=off;   # DNS interno de Docker: tolera que un servicio se reinicie y cambie de IP

map $svc $api_upstream {
  usuarios   http://usuarios:3001;
  peliculas  http://peliculas:3002;
  reservas   http://reservas:3003;
}

map $rest $api_path {
  default                    /api/v1/$rest;
  ~^(health|\.well-known/.*)$ /$rest;
}

server {
  listen 80;
  listen 443 ssl;
  server_name _;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/key.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;

  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 10m;           # pósters y fotos

  location ~ ^/api/(?<svc>usuarios|peliculas|reservas)/(?<rest>.*)$ {
    proxy_pass $api_upstream$api_path$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
