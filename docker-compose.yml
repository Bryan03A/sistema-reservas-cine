# Cine Andino: 3 microservicios + 3 bases PostgreSQL + frontend.   Uso:  cp .env.example .env  &&  docker compose up --build
name: cine-reservas

x-db: &db
  image: postgres:16-alpine
  restart: unless-stopped
  environment:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres"]
    interval: 5s
    timeout: 5s
    retries: 10

services:
  db-usuarios:
    <<: *db
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: "${DB_PASSWORD:-postgres}", POSTGRES_DB: db_usuarios }
    volumes: [db_usuarios:/var/lib/postgresql/data]
    ports: ["5433:5432"]
  db-peliculas:
    <<: *db
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: "${DB_PASSWORD:-postgres}", POSTGRES_DB: db_peliculas }
    volumes: [db_peliculas:/var/lib/postgresql/data]
    ports: ["5434:5432"]
  db-reservas:
    <<: *db
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: "${DB_PASSWORD:-postgres}", POSTGRES_DB: db_reservas }
    volumes: [db_reservas:/var/lib/postgresql/data]
    ports: ["5435:5432"]

  usuarios:
    build: ./backend/usuarios
    restart: unless-stopped
    depends_on: { db-usuarios: { condition: service_healthy } }
    environment:
      PORT: 3001
      DATABASE_URL: postgres://postgres:${DB_PASSWORD:-postgres}@db-usuarios:5432/db_usuarios
      JWT_ISSUER: ${JWT_ISSUER:-cine-usuarios}
      KEYS_DIR: /data/keys
      DEMO_MODE: ${DEMO_MODE:-true}
      DEV_ACCESS_COMMAND: ${DEV_ACCESS_COMMAND:-/dev}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      CORS_ALLOW_LAN: ${CORS_ALLOW_LAN:-true}
      SERVICE_CLIENTS: '{"peliculas":"${PELICULAS_CLIENT_SECRET:-peliculas-secret}","reservas":"${RESERVAS_CLIENT_SECRET:-reservas-secret}"}'
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Cine Andino <no-reply@cine.local>}
    volumes: [usuarios_keys:/data/keys]
    ports: ["3001:3001"]

  peliculas:
    build: ./backend/peliculas
    restart: unless-stopped
    depends_on: { db-peliculas: { condition: service_healthy }, usuarios: { condition: service_started } }
    environment:
      PORT: 3002
      DATABASE_URL: postgresql+psycopg2://postgres:${DB_PASSWORD:-postgres}@db-peliculas:5432/db_peliculas
      USUARIOS_URL: http://usuarios:3001
      RESERVAS_URL: http://reservas:3003
      JWT_ISSUER: ${JWT_ISSUER:-cine-usuarios}
      SERVICE_CLIENT_ID: peliculas
      SERVICE_CLIENT_SECRET: ${PELICULAS_CLIENT_SECRET:-peliculas-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      CORS_ALLOW_LAN: ${CORS_ALLOW_LAN:-true}
      TIMEZONE: America/Guayaquil
    ports: ["3002:3002"]

  reservas:
    build: ./backend/reservas
    restart: unless-stopped
    depends_on: { db-reservas: { condition: service_healthy }, usuarios: { condition: service_started }, peliculas: { condition: service_started } }
    environment:
      PORT: 3003
      DATABASE_URL: postgres://postgres:${DB_PASSWORD:-postgres}@db-reservas:5432/db_reservas
      USUARIOS_URL: http://usuarios:3001
      PELICULAS_URL: http://peliculas:3002
      JWT_ISSUER: ${JWT_ISSUER:-cine-usuarios}
      SERVICE_CLIENT_ID: reservas
      SERVICE_CLIENT_SECRET: ${RESERVAS_CLIENT_SECRET:-reservas-secret}
      QR_SECRET: ${QR_SECRET:-cambia-este-secreto-del-qr}
      RESERVA_TTL_SECONDS: ${RESERVA_TTL_SECONDS:-300}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      CORS_ALLOW_LAN: ${CORS_ALLOW_LAN:-true}
    ports: ["3003:3003"]

  frontend:
    build: ./nginx
    restart: unless-stopped
    depends_on: [usuarios, peliculas, reservas]
    environment:
      EXTRA_IPS: ${EXTRA_IPS:-}        # IP(s) del PC en la red local para el certificado HTTPS, ej. 192.168.1.15
      EXTRA_HOSTS: ${EXTRA_HOSTS:-}
    volumes: ["./frontend:/usr/share/nginx/html:ro", "nginx_certs:/etc/nginx/certs"]
    ports: ["5173:80", "5443:443"]

volumes: { db_usuarios: {}, db_peliculas: {}, db_reservas: {}, usuarios_keys: {}, nginx_certs: {} }
